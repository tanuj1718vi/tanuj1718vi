<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="achBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A63F5"/>
      <stop offset="50%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#8A63F5"/>
    </linearGradient>
    <linearGradient id="achFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141826"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="achGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="580" height="180" rx="14" fill="url(#achFill)" stroke="url(#achBorder)" stroke-width="1.5"/>
  <rect x="10" y="10" width="580" height="3" fill="#61DAFB" opacity="0.6">
    <animate attributeName="y" values="12;185;12" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="30" y="42" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="2">ACHIEVEMENTS</text>
  <line x1="30" y1="54" x2="570" y2="54" stroke="#8A63F5" stroke-opacity="0.4"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#e6e6f0">
    <!-- row 1 -->
    <g>
      <circle cx="40" cy="82" r="5" fill="#8A63F5">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="55" y="86">Internship — IBM</text>
    </g>
    <g>
      <circle cx="230" cy="82" r="5" fill="#8A63F5">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <text x="245" y="86">Internship — Zidio Development</text>
    </g>
    <!-- row 2 -->
    <g>
      <circle cx="40" cy="112" r="5" fill="#61DAFB">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="55" y="116">Traineeship — IIT Roorkee x Masai (Agentic AI)</text>
    </g>
    <!-- row 3 -->
    <g>
      <circle cx="40" cy="142" r="5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text x="55" y="146">Certified — Generative AI (Infosys Springboard)</text>
    </g>
    <g>
      <circle cx="380" cy="142" r="5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="395" y="146">MCP — Chief of Staff (Masai)</text>
    </g>
    <!-- row 4 -->
    <g>
      <circle cx="40" cy="172" r="5" fill="#d29922">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="55" y="176">6 public systems shipped — APEX, AEGIS-FraudGuard, FORESIGHT + 3 more</text>
    </g>
  </g>

  <!-- soft ambient glow -->
  <circle cx="560" cy="30" r="18" fill="#8A63F5" opacity="0.25" filter="url(#achGlow)">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>

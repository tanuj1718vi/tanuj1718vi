  <rect x="10" y="10" width="500" height="410" rx="14" fill="url(#panelFill2)" stroke="url(#cardBorder2)" stroke-width="1.5"/>

  <rect x="10" y="10" width="500" height="3" fill="#61DAFB" opacity="0.6">
    <animate attributeName="y" values="12;408;12" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="36" y="48" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">SYSTEM PROFILE</text>
  <line x1="36" y1="60" x2="484" y2="60" stroke="#8A63F5" stroke-opacity="0.4"/>

  <g font-family="Consolas, 'Courier New', monospace" stroke="#61DAFB" stroke-width="1.6" fill="none">
    <!-- brain/role icon: simple node cluster -->
    <circle cx="46" cy="88" r="9"/>
    <circle cx="40" cy="88" r="3" fill="#61DAFB" stroke="none"/>
    <circle cx="52" cy="88" r="3" fill="#61DAFB" stroke="none"/>


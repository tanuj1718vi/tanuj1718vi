<svg viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="statBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A63F5"/>
      <stop offset="50%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#8A63F5"/>
    </linearGradient>
    <linearGradient id="statFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141826"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="540" height="200" rx="14" fill="url(#statFill)" stroke="url(#statBorder)" stroke-width="1.5"/>
  <rect x="10" y="10" width="540" height="3" fill="#61DAFB" opacity="0.6">
    <animate attributeName="y" values="12;205;12" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="30" y="44" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="2">GITHUB ANALYTICS</text>
  <line x1="30" y1="56" x2="530" y2="56" stroke="#8A63F5" stroke-opacity="0.4"/>

  <line x1="196" y1="75" x2="196" y2="195" stroke="#8A63F5" stroke-opacity="0.25"/>
  <line x1="373" y1="75" x2="373" y2="195" stroke="#8A63F5" stroke-opacity="0.25"/>

  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <!-- total contributions -->
    <text x="113" y="120" font-size="34" font-weight="700" fill="#8A63F5">142</text>
    <text x="113" y="145" font-size="12" fill="#c9c9d8">TOTAL CONTRIBUTIONS</text>
    <text x="113" y="163" font-size="11" fill="#6b6b80">Jan 31 - Present</text>

    <!-- current streak with pulsing flame -->
    <g transform="translate(284,100)">
      <circle r="24" fill="none" stroke="#61DAFB" stroke-width="2">
        <animate attributeName="r" values="22;26;22" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="7" font-size="20" font-weight="700" fill="#61DAFB">1</text>
    </g>
    <text x="284" y="145" font-size="12" fill="#c9c9d8">CURRENT STREAK</text>
    <text x="284" y="163" font-size="11" fill="#6b6b80">Sep 10</text>

    <!-- longest streak -->
    <text x="461" y="120" font-size="34" font-weight="700" fill="#3fb950">5</text>
    <text x="461" y="145" font-size="12" fill="#c9c9d8">LONGEST STREAK</text>
    <text x="461" y="163" font-size="11" fill="#6b6b80">Mar 11 - Mar 15</text>
  </g>
</svg>

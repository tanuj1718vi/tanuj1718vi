<svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A63F5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8A63F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <text x="260" y="30" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ffffff" letter-spacing="2">◉ AI CORE</text>

  <!-- outer rotating dashed ring -->
  <g transform="translate(260,205)">
    <circle r="150" fill="none" stroke="#61DAFB" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- connecting lines: center to 4 nodes -->
  <line id="lRAG"    x1="260" y1="205" x2="260" y2="90"  stroke="#8A63F5" stroke-opacity="0.4" stroke-width="1.5"/>
  <line id="lAGENTS" x1="260" y1="205" x2="390" y2="205" stroke="#8A63F5" stroke-opacity="0.4" stroke-width="1.5"/>
  <line id="lMEMORY" x1="260" y1="205" x2="260" y2="320" stroke="#8A63F5" stroke-opacity="0.4" stroke-width="1.5"/>
  <line id="lML"     x1="260" y1="205" x2="130" y2="205" stroke="#8A63F5" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- traveling particles along each line -->
  <circle r="4" fill="#61DAFB">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M260,205 L260,90"/>
  </circle>
  <circle r="4" fill="#61DAFB">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M260,205 L390,205"/>
  </circle>
  <circle r="4" fill="#61DAFB">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M260,205 L260,320"/>
  </circle>
  <circle r="4" fill="#61DAFB">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M260,205 L130,205"/>
  </circle>

  <!-- pulsing core -->
  <circle cx="260" cy="205" r="40" fill="url(#coreGlow)">
    <animate attributeName="r" values="34;44;34" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="205" r="16" fill="#0d1117" stroke="#8A63F5" stroke-width="2"/>
  <circle cx="260" cy="205" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1">
    <animate attributeName="r" values="16;26;16" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#e6e6f0">
    <circle cx="260" cy="90" r="7" fill="#8A63F5"/>
    <text x="260" y="72" text-anchor="middle">RAG</text>

    <circle cx="390" cy="205" r="7" fill="#8A63F5"/>
    <text x="430" y="210" text-anchor="middle">AGENTS</text>

    <circle cx="260" cy="320" r="7" fill="#8A63F5"/>
    <text x="260" y="345" text-anchor="middle">MEMORY</text>

    <circle cx="130" cy="205" r="7" fill="#8A63F5"/>
    <text x="90" y="210" text-anchor="middle">ML</text>
  </g>
</svg>

<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A63F5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8A63F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A63F5"/>
      <stop offset="50%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#8A63F5"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <ellipse cx="450" cy="110" rx="420" ry="140" fill="url(#glow)"/>

  <!-- orbiting ring 1 -->
  <g transform="translate(450,110)">
    <circle r="150" fill="none" stroke="#8A63F5" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <circle cx="150" cy="0" r="4" fill="#61DAFB"/>
      <circle cx="150" cy="0" r="9" fill="#61DAFB" opacity="0.25"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="18s" repeatCount="indefinite"/>
      <circle cx="150" cy="0" r="4" fill="#8A63F5"/>
      <circle cx="150" cy="0" r="9" fill="#8A63F5" opacity="0.25"/>
    </g>

    <!-- orbiting ring 2, opposite direction -->
    <circle r="95" fill="none" stroke="#61DAFB" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      <circle cx="95" cy="0" r="3" fill="#ffffff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="90" to="-270" dur="11s" repeatCount="indefinite"/>
      <circle cx="95" cy="0" r="3" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- title -->
  <text x="450" y="98" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="42" font-weight="700" fill="url(#titleGrad)" letter-spacing="4">
    TANUJ NEGI
  </text>
  <text x="450" y="98" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="42" font-weight="700" fill="url(#titleGrad)" letter-spacing="4" filter="url(#softBlur)" opacity="0.5">
    TANUJ NEGI
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="130" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#c9c9d8" letter-spacing="6">
    AI SYSTEMS LAB
  </text>

  <line x1="270" y1="145" x2="630" y2="145" stroke="#8A63F5" stroke-opacity="0.4" stroke-width="1"/>

  <text x="450" y="172" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8f8fa3" letter-spacing="3">
    AI/ML • AGENTIC AI • GENAI • RAG • PYTHON
  </text>
</svg>

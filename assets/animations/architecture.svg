<svg viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A63F5"/>
    </marker>
  </defs>

  <text x="300" y="26" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#ffffff" letter-spacing="2">ARCHITECTURE — AEGIS-RUNTIME</text>

  <!-- helper: node style applied per rect/text pair -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#e6e6f0" text-anchor="middle">

    <!-- connecting lines (drawn first, behind nodes) -->
    <g stroke="#8A63F5" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="300" y1="75"  x2="300" y2="105"/>
      <line x1="300" y1="135" x2="300" y2="165"/>
      <line x1="300" y1="195" x2="300" y2="220"/>
      <line x1="255" y1="225" x2="195" y2="255"/>
      <line x1="345" y1="225" x2="405" y2="255"/>
      <line x1="195" y1="290" x2="255" y2="320"/>
      <line x1="405" y1="290" x2="345" y2="320"/>
      <line x1="300" y1="350" x2="300" y2="380"/>
      <line x1="300" y1="410" x2="300" y2="435"/>
      <line x1="270" y1="460" x2="210" y2="490"/>
      <line x1="330" y1="460" x2="390" y2="490"/>
      <line x1="390" y1="525" x2="390" y2="560"/>
    </g>

    <!-- feedback loop: REPLAN back to PLANNER -->
    <path d="M 420 575 C 520 575, 520 180, 340 180" fill="none" stroke="#d29922" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>

    <!-- traveling particles -->
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.6s" repeatCount="indefinite" path="M300,75 L300,105"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M300,135 L300,165"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M300,195 L300,220"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite" path="M255,225 L195,255"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite" path="M345,225 L405,255"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.4s" begin="1.3s" repeatCount="indefinite" path="M195,290 L255,320"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.4s" begin="1.3s" repeatCount="indefinite" path="M405,290 L345,320"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.4s" begin="1.7s" repeatCount="indefinite" path="M300,350 L300,380"/></circle>
    <circle r="3.5" fill="#61DAFB"><animateMotion dur="1.2s" begin="2.0s" repeatCount="indefinite" path="M300,410 L300,435"/></circle>
    <circle r="3.5" fill="#3fb950"><animateMotion dur="1.4s" begin="2.3s" repeatCount="indefinite" path="M270,460 L210,490"/></circle>
    <circle r="3.5" fill="#f85149"><animateMotion dur="1.4s" begin="2.3s" repeatCount="indefinite" path="M330,460 L390,490"/></circle>
    <circle r="3.5" fill="#f85149"><animateMotion dur="1.2s" begin="2.7s" repeatCount="indefinite" path="M390,525 L390,560"/></circle>
    <circle r="3.5" fill="#d29922"><animateMotion dur="4s" begin="3s" repeatCount="indefinite" path="M 420 575 C 520 575, 520 180, 340 180"/></circle>

    <!-- nodes -->
    <g>
      <rect x="240" y="45" width="120" height="30" rx="6" fill="#141826" stroke="#8A63F5"/>
      <text x="300" y="65">USER</text>
    </g>
    <g>
      <rect x="200" y="105" width="200" height="30" rx="6" fill="#141826" stroke="#8A63F5"/>
      <text x="300" y="125">GOAL ANALYZER</text>
    </g>
    <g>
      <rect x="220" y="165" width="160" height="30" rx="6" fill="#141826" stroke="#8A63F5"/>
      <text x="300" y="185">PLANNER</text>
    </g>
    <g>
      <rect x="135" y="255" width="120" height="35" rx="6" fill="#141826" stroke="#61DAFB"/>
      <text x="195" y="277">AGENT A</text>
    </g>
    <g>
      <rect x="345" y="255" width="120" height="35" rx="6" fill="#141826" stroke="#61DAFB"/>
      <text x="405" y="277">AGENT B</text>
    </g>
    <g>
      <rect x="220" y="320" width="160" height="30" rx="6" fill="#141826" stroke="#8A63F5"/>
      <text x="300" y="340">RUNTIME</text>
    </g>
    <g>
      <rect x="200" y="380" width="200" height="30" rx="6" fill="#141826" stroke="#8A63F5"/>
      <text x="300" y="400">VERIFICATION</text>
    </g>
    <g>
      <rect x="150" y="490" width="120" height="32" rx="6" fill="#0f2a17" stroke="#3fb950"/>
      <text x="210" y="511" fill="#3fb950">SUCCESS</text>
    </g>
    <g>
      <rect x="330" y="490" width="120" height="32" rx="6" fill="#2a1414" stroke="#f85149"/>
      <text x="390" y="511" fill="#f85149">FAILURE</text>
    </g>
    <g>
      <rect x="330" y="560" width="120" height="32" rx="6" fill="#2a2414" stroke="#d29922"/>
      <text x="390" y="581" fill="#d29922">REPLAN</text>
    </g>
  </g>

  <text x="300" y="620" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6b6b80">APEX and AEGIS-FraudGuard both run on this shared runtime.</text>
</svg>

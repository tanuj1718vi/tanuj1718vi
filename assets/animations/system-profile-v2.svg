  <rect x="10" y="392" width="500" height="1" fill="#8A63F5" opacity="0.3"/>
  <text x="36" y="414" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6b6b80">negit605@gmail.com  |  linkedin.com/in/tanuj-negi-146155351</text>
